<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon profil · Gamer Stats</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Bandeau : logo à gauche, nom du profil et score total à droite -->
  <header class="site-header profile-bar">
    <div class="container">
      <div class="brand-menu" data-brand></div>
      <div class="profile-info">
        <span class="profile-name" id="profile-name"></span>
        <span class="profile-score"><span id="total">–</span> <small>pts</small></span>
        <button type="button" class="link-button" id="logout">Déconnexion</button>
      </div>
    </div>
  </header>

  <!-- À gauche : une carte par jeu (créées par le script ci-dessous). À droite : le classement. -->
  <main class="container profile-main layout-profile">
    <div class="games-grid" id="games"></div>

    <aside class="card leaderboard">
      <h2>Classement</h2>
      <div id="leaderboard"><p class="muted">Chargement…</p></div>
    </aside>
  </main>

  <!-- Les fenêtres de détail (une par jeu) sont ajoutées ici par le script. -->
  <div id="dialogs"></div>

  <script type="module">
    import {
      supabase, currentUser, formatNumber, setupBrandMenu, getLinkedUsername, computeScores,
      getDisplayName, openNameDialog,
    } from "./js/supabase.js";
    import { GAMES } from "./js/games.js";
    import { renderLeaderboard } from "./js/leaderboard.js";

    const user = await currentUser();
    if (!user) {
      window.location.replace("connexion.html");
      throw new Error("Non connecté : redirection vers la page de connexion.");
    }

    setupBrandMenu();
    const $ = (id) => document.getElementById(id);
    const leaderboard = $("leaderboard");

    // Bandeau : pseudo et déconnexion. Sans pseudo (ex. première connexion avec Google),
    // on demande d'en choisir un.
    const pseudo = await getDisplayName();
    $("profile-name").textContent = pseudo ?? "";
    if (!pseudo) openNameDialog({ required: true });
    document.addEventListener("gamerstats:pseudo", (event) => {
      $("profile-name").textContent = event.detail;
      renderLeaderboard(leaderboard);
    });
    $("logout").addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.href = "index.html";
    });

    // Couleur de la pastille selon le « Top x % » : dégradé continu
    // du rouge (Top 100 %) au violet (Top 0,1 %), en passant par orange, jaune, vert, bleu.
    // Échelle logarithmique : passer de Top 10 % à Top 1 % change autant la couleur
    // que passer de Top 100 % à Top 10 %.
    function pillColor(top) {
      const t = (Math.log10(Math.min(100, Math.max(0.1, top))) + 1) / 3;  // 0 = Top 0,1 %, 1 = Top 100 %
      const hue = 275 * (1 - t);  // 275 = violet, 0 = rouge
      return `hsl(${hue.toFixed(0)}, 70%, 45%)`;
    }

    function fillPill(pill, top) {
      pill.textContent = `Top ${top.toLocaleString("fr-FR", { maximumFractionDigits: 1 })} %`;
      pill.style.background = pillColor(top);
      pill.hidden = false;
    }

    // Crée la carte et la fenêtre de détail d'un jeu.
    function createGame(game) {
      const icon = game.image
        ? `<span class="game-icon game-icon-image" aria-hidden="true"><img src="${game.image}" alt=""></span>`
        : `<span class="game-icon" style="background:${game.color}" aria-hidden="true">${game.icon}</span>`;

      // Carte « à collectionner » : cadre en dégradé, illustration du jeu, points, stats en bas.
      const art = game.image
        ? `<img class="tc-image" src="${game.image}" alt="">`
        : `<span class="tc-icon" aria-hidden="true">${game.icon}</span>`;
      const card = document.createElement("button");
      card.type = "button";
      card.className = "trading-card empty";
      card.style.setProperty("--game", game.color);
      card.setAttribute("aria-haspopup", "dialog");
      card.setAttribute("aria-label", `${game.name} : voir le détail`);
      card.innerHTML = `
        <span class="tc-inner">
          <span class="tc-art">${art}<span class="pill tc-badge" data-pill hidden></span></span>
          <span class="tc-title"><b>${game.name}</b><span data-points></span></span>
          <span class="tc-stats" data-stats>
            <span class="tc-add">+ Ajouter mon pseudo</span>
          </span>
        </span>`;
      $("games").append(card);

      const dialog = document.createElement("dialog");
      dialog.className = "game-dialog";
      dialog.innerHTML = `
        <div class="dialog-head">
          ${icon}
          <h2>${game.name}</h2>
          <button type="button" class="dialog-close" aria-label="Fermer">×</button>
        </div>
        <div data-scores hidden>
          <div class="dialog-summary">
            <span class="game-points" data-points></span>
            <span class="muted">points</span>
            <span class="pill" data-pill></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Mode</th>
                  <th class="num">${game.ratingLabel}</th>
                  <th class="num">Percentile</th>
                  <th class="num">Elo équivalent Blitz</th>
                  <th class="num">Points</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <p class="muted">${game.note}</p>
        <form>
          <label for="username-${game.slug}">${game.inputLabel}</label>
          <div class="form-row">
            <input id="username-${game.slug}" type="text" required autocomplete="off" placeholder="${game.placeholder}">
            <button type="submit">Lier et calculer</button>
          </div>
          <p class="message" role="status"></p>
        </form>`;
      $("dialogs").append(dialog);

      // Ouverture / fermeture : clic sur la carte, sur ×, sur le fond flouté, ou Échap.
      card.addEventListener("click", () => dialog.showModal());
      dialog.querySelector(".dialog-close").addEventListener("click", () => dialog.close());
      dialog.addEventListener("click", (event) => {
        if (event.target === dialog) dialog.close();
      });

      const form = dialog.querySelector("form");
      const input = form.querySelector("input");
      const submit = form.querySelector("button");
      const message = form.querySelector(".message");
      const showMessage = (text, type = "") => {
        message.textContent = text;
        message.className = `message ${type}`;
      };

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submit.disabled = true;
        showMessage(`Récupération de tes stats ${game.name}…`);
        try {
          await game.linkAndRefresh(user.id, input.value.trim());
          showMessage("Calcul de ton score…");
          renderAll(await computeScores());
          renderLeaderboard(leaderboard);
          showMessage("Score mis à jour !", "success");
          submit.textContent = "Actualiser";
        } catch (error) {
          showMessage(error.message || "Une erreur est survenue.", "error");
        }
        submit.disabled = false;
      });

      return { game, card, dialog, input, submit };
    }

    // Met à jour la carte et la fenêtre d'un jeu avec ses lignes de score.
    function renderGame({ game, card, dialog }, rows) {
      if (!rows.length) return;
      const best = rows.reduce((a, b) => (b.points > a.points ? b : a));
      const top = Math.max(0.1, 100 - Number(best.percentile));

      card.classList.remove("empty");
      card.style.setProperty("--top", pillColor(top));
      card.querySelector("[data-points]").textContent = formatNumber(best.points);
      fillPill(card.querySelector("[data-pill]"), top);
      const modeName = rows.length > 1 ? best.mode : (game.modeLabel ?? best.mode);
      card.querySelector("[data-stats]").innerHTML = `
        <span>${rows.length > 1 ? "Meilleur mode" : "Mode"}<strong>${modeName}</strong></span>
        <span>${game.ratingLabel}<strong>${best.rating}</strong></span>`;

      dialog.querySelector("[data-points]").textContent = formatNumber(best.points);
      fillPill(dialog.querySelector("[data-pill]"), top);
      dialog.querySelector("tbody").innerHTML = rows.map((r) => `
        <tr class="${r === best ? "best" : ""}">
          <td>${r.mode}</td>
          <td class="num">${r.rating}</td>
          <td class="num">${Number(r.percentile).toFixed(1)} %</td>
          <td class="num">${formatNumber(r.equivalent_elo)}</td>
          <td class="num">${formatNumber(r.points)}</td>
        </tr>`).join("");
      dialog.querySelector("[data-scores]").hidden = false;
    }

    const games = GAMES.map(createGame);

    // Met à jour le bandeau et toutes les cartes.
    function renderAll({ rows, total }) {
      $("total").textContent = formatNumber(total);
      for (const g of games) renderGame(g, rows.filter((r) => r.game === g.game.name));
    }

    // Au chargement : on préremplit les pseudos déjà liés et on affiche les scores.
    const linked = await Promise.all(games.map((g) => getLinkedUsername(user.id, g.game.slug)));
    games.forEach((g, i) => {
      if (linked[i]) {
        g.input.value = linked[i];
        g.submit.textContent = "Actualiser";
      }
    });
    if (linked.some(Boolean)) {
      try { renderAll(await computeScores()); } catch { /* les cartes restent vides */ }
    } else {
      $("total").textContent = "0";
    }
    renderLeaderboard(leaderboard);  // après le calcul, pour que ton score soit à jour
  </script>
</body>
</html>
